<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Skaner — hujjatni avtomatik kesib olish</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#0B0D10;
    --panel:#14171B;
    --panel-edge:#22262B;
    --paper:#F8F6F0;
    --paper-edge:#E4E0D6;
    --accent:#29D3C0;
    --accent-dim:#1A8F84;
    --ink:#F2F1ED;
    --ink-dim:#8B9096;
    --danger:#E8615A;
    --radius:18px;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{height:100%;}
  body{
    margin:0;
    background:var(--bg);
    color:var(--ink);
    font-family:'Manrope', system-ui, sans-serif;
    display:flex;
    align-items:center;
    justify-content:center;
    min-height:100vh;
    overflow:hidden;
  }
  #app{
    width:100%;
    max-width:460px;
    height:100vh;
    max-height:900px;
    position:relative;
    background:var(--panel);
    display:flex;
    flex-direction:column;
    overflow:hidden;
  }
  @media (min-width:520px){
    #app{
      height:860px;
      border-radius:28px;
      border:1px solid var(--panel-edge);
      box-shadow:0 40px 100px rgba(0,0,0,.5);
    }
  }

  .topbar{
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:16px 18px 10px;
    z-index:5;
  }
  .brand{
    font-weight:800;
    font-size:16px;
    letter-spacing:-0.01em;
    display:flex;
    align-items:center;
    gap:8px;
  }
  .brand .dot{width:8px;height:8px;border-radius:50%;background:var(--accent);}
  .hint{
    font-size:12.5px;
    color:var(--ink-dim);
    font-weight:500;
  }

  .screen{
    flex:1;
    display:none;
    flex-direction:column;
    min-height:0;
    position:relative;
  }
  .screen.active{display:flex;}

  /* ---------- CAMERA SCREEN ---------- */
  .viewfinder-wrap{
    position:relative;
    flex:1;
    margin:0 14px 14px;
    border-radius:16px;
    overflow:hidden;
    background:#000;
    display:flex;
    align-items:center;
    justify-content:center;
  }
  #video, #overlay{
    position:absolute;
    top:0; left:0;
    width:100%;
    height:100%;
    object-fit:cover;
  }
  #video{background:#000;}
  .cam-fallback{
    position:absolute;
    inset:0;
    display:none;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    gap:14px;
    text-align:center;
    padding:0 28px;
    color:var(--ink-dim);
    font-size:14px;
    line-height:1.5;
  }
  .cam-fallback.show{display:flex;}
  .status-chip{
    position:absolute;
    top:12px; left:50%;
    transform:translateX(-50%);
    background:rgba(10,12,14,.65);
    backdrop-filter:blur(6px);
    border:1px solid rgba(255,255,255,.08);
    padding:6px 14px;
    border-radius:100px;
    font-size:12.5px;
    font-weight:600;
    color:var(--ink-dim);
    display:flex;
    align-items:center;
    gap:7px;
    transition:color .2s, border-color .2s;
    z-index:4;
  }
  .status-chip .led{width:7px;height:7px;border-radius:50%;background:var(--ink-dim); transition:background .2s;}
  .status-chip.locked{color:var(--accent); border-color:rgba(41,211,192,.35);}
  .status-chip.locked .led{background:var(--accent); box-shadow:0 0 8px var(--accent);}

  .controls{
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:6px 26px 26px;
  }
  .side-btn{
    width:48px; height:48px;
    border-radius:50%;
    border:1px solid var(--panel-edge);
    background:#1B1F24;
    color:var(--ink-dim);
    display:flex; align-items:center; justify-content:center;
    cursor:pointer;
  }
  .shutter{
    width:74px; height:74px;
    border-radius:50%;
    background:var(--ink);
    border:5px solid rgba(255,255,255,.15);
    display:flex; align-items:center; justify-content:center;
    cursor:pointer;
    transition:transform .1s;
  }
  .shutter:active{transform:scale(.92);}
  .shutter::after{
    content:'';
    width:58px; height:58px;
    border-radius:50%;
    background:var(--ink);
  }
  #fileInput{display:none;}

  /* ---------- REVIEW SCREEN ---------- */
  .review-canvas-wrap{
    flex:1;
    margin:14px;
    border-radius:16px;
    background:#000;
    display:flex;
    align-items:center;
    justify-content:center;
    position:relative;
    overflow:hidden;
    touch-action:none;
  }
  #reviewCanvas{max-width:100%; max-height:100%;}
  .review-help{
    text-align:center;
    color:var(--ink-dim);
    font-size:13px;
    padding:0 30px 8px;
  }
  .review-actions, .result-actions{
    display:flex;
    gap:10px;
    padding:10px 18px 24px;
  }
  .btn{
    flex:1;
    padding:15px 16px;
    border-radius:14px;
    border:none;
    font-family:inherit;
    font-weight:700;
    font-size:14.5px;
    cursor:pointer;
    display:flex; align-items:center; justify-content:center; gap:8px;
  }
  .btn-ghost{background:#1B1F24; color:var(--ink); border:1px solid var(--panel-edge);}
  .btn-primary{background:var(--accent); color:#04211E;}
  .btn-primary:active{background:var(--accent-dim);}

  /* ---------- RESULT SCREEN ---------- */
  .result-canvas-wrap{
    flex:1;
    margin:14px 14px 4px;
    border-radius:16px;
    background:repeating-conic-gradient(#1c1f23 0% 25%, #17191d 0% 50%) 0 0/18px 18px;
    display:flex;
    align-items:center;
    justify-content:center;
    overflow:hidden;
    padding:12px;
  }
  #resultCanvas{
    max-width:100%;
    max-height:100%;
    background:var(--paper);
    box-shadow:0 12px 30px rgba(0,0,0,.45);
  }
  .modes{
    display:flex;
    gap:8px;
    padding:14px 18px 0;
  }
  .mode-chip{
    flex:1;
    text-align:center;
    padding:10px 8px;
    border-radius:11px;
    background:#1B1F24;
    border:1px solid var(--panel-edge);
    color:var(--ink-dim);
    font-size:12.5px;
    font-weight:700;
    cursor:pointer;
  }
  .mode-chip.active{
    background:rgba(41,211,192,.12);
    border-color:var(--accent);
    color:var(--accent);
  }

  .toast{
    position:absolute;
    bottom:100px; left:50%;
    transform:translateX(-50%) translateY(10px);
    background:var(--ink);
    color:#0B0D10;
    padding:10px 18px;
    border-radius:100px;
    font-size:13px;
    font-weight:700;
    opacity:0;
    pointer-events:none;
    transition:opacity .2s, transform .2s;
    z-index:20;
    white-space:nowrap;
  }
  .toast.show{opacity:1; transform:translateX(-50%) translateY(0);}
</style>
</head>
<body>

<div id="app">

  <!-- ============ CAMERA SCREEN ============ -->
  <div class="screen active" id="screen-camera">
    <div class="topbar">
      <div class="brand"><span class="dot"></span>Skaner</div>
      <div class="hint" id="loadingHint">Model yuklanmoqda…</div>
    </div>
    <div class="viewfinder-wrap">
      <video id="video" autoplay playsinline muted></video>
      <canvas id="overlay"></canvas>
      <div class="status-chip" id="statusChip"><span class="led"></span><span id="statusText">Hujjat qidirilmoqda</span></div>
      <div class="cam-fallback" id="camFallback">
        <div>Kamera ochilmadi. Fayldan rasim tanlang yoki brauzer sozlamalaridan kameraga ruxsat bering.</div>
      </div>
    </div>
    <div class="controls">
      <div class="side-btn" id="galleryBtn" title="Fayldan tanlash">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none"><rect x="3" y="5" width="18" height="14" rx="2" stroke="currentColor" stroke-width="1.8"/><circle cx="8.5" cy="10" r="1.5" fill="currentColor"/><path d="M21 15l-5.5-5-9.5 9" stroke="currentColor" stroke-width="1.8"/></svg>
      </div>
      <div class="shutter" id="shutterBtn"></div>
      <div class="side-btn" id="flipBtn" title="Kamerani almashtirish">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none"><path d="M4 8a8 8 0 0 1 13.5-4.5M20 16a8 8 0 0 1-13.5 4.5" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/><path d="M17.5 2.5v4.5H13M6.5 21.5V17H11" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </div>
    </div>
    <input type="file" id="fileInput" accept="image/*" capture="environment">
  </div>

  <!-- ============ REVIEW SCREEN (drag corners) ============ -->
  <div class="screen" id="screen-review">
    <div class="topbar">
      <div class="brand"><span class="dot"></span>Chegaralarni tekshiring</div>
    </div>
    <div class="review-canvas-wrap">
      <canvas id="reviewCanvas"></canvas>
    </div>
    <div class="review-help">Burchaklar noto'g'ri bo'lsa, ularni ushlab suring</div>
    <div class="review-actions">
      <button class="btn btn-ghost" id="retakeBtn">Qayta olish</button>
      <button class="btn btn-primary" id="cropBtn">Kesib olish</button>
    </div>
  </div>

  <!-- ============ RESULT SCREEN ============ -->
  <div class="screen" id="screen-result">
    <div class="topbar">
      <div class="brand"><span class="dot"></span>Tayyor</div>
    </div>
    <div class="result-canvas-wrap">
      <canvas id="resultCanvas"></canvas>
    </div>
    <div class="modes">
      <div class="mode-chip active" data-mode="bw">Oq-qora</div>
      <div class="mode-chip" data-mode="color">Rangli</div>
      <div class="mode-chip" data-mode="original">Original</div>
    </div>
    <div class="result-actions">
      <button class="btn btn-ghost" id="newScanBtn">Qayta olish</button>
      <button class="btn btn-primary" id="downloadBtn">Yuklab olish</button>
    </div>
  </div>

  <div class="toast" id="toast"></div>
</div>

<script src="https://docs.opencv.org/4.9.0/opencv.js"></script>
<script>
(function(){
  "use strict";

  // ---------- state ----------
  let cvReady = false;
  let stream = null;
  let currentFacing = 'environment';
  let detectLoopId = null;
  let lastDetectTs = 0;
  let lockedFrames = 0;

  let capturedMat = null;        // full-res RGBA cv.Mat of the frozen photo
  let reviewCorners = null;      // 4 points in capturedMat coordinate space
  let reviewScale = 1;           // display px -> image px factor on review canvas
  let draggingIdx = -1;
  let warpedMat = null;          // perspective-corrected RGBA result
  let currentMode = 'bw';

  const $ = (id) => document.getElementById(id);
  const video = $('video');
  const overlay = $('overlay');
  const octx = overlay.getContext('2d');
  const statusChip = $('statusChip');
  const statusText = $('statusText');
  const loadingHint = $('loadingHint');
  const camFallback = $('camFallback');
  const toastEl = $('toast');

  function toast(msg){
    toastEl.textContent = msg;
    toastEl.classList.add('show');
    clearTimeout(toast._t);
    toast._t = setTimeout(()=>toastEl.classList.remove('show'), 1800);
  }

  function showScreen(name){
    document.querySelectorAll('.screen').forEach(s=>s.classList.remove('active'));
    $('screen-'+name).classList.add('active');
  }

  // ---------- OpenCV load ----------
  window.onOpenCvReadyPoll = setInterval(()=>{
    if (window.cv && cv.Mat){
      clearInterval(window.onOpenCvReadyPoll);
      cvReady = true;
      loadingHint.textContent = 'Tayyor';
      setTimeout(()=>{ loadingHint.style.display='none'; }, 1200);
      startCamera();
    }
  }, 150);

  // ---------- camera ----------
  async function startCamera(){
    try{
      if (stream) stream.getTracks().forEach(t=>t.stop());
      stream = await navigator.mediaDevices.getUserMedia({
        video: { facingMode: { ideal: currentFacing }, width:{ideal:1920}, height:{ideal:1080} },
        audio:false
      });
      video.srcObject = stream;
      camFallback.classList.remove('show');
      await video.play();
      video.addEventListener('loadedmetadata', sizeOverlay, {once:true});
      if (video.videoWidth) sizeOverlay();
      runDetectLoop();
    }catch(err){
      camFallback.classList.add('show');
      statusText.textContent = 'Kamera yo\'q';
    }
  }

  function sizeOverlay(){
    overlay.width = video.videoWidth;
    overlay.height = video.videoHeight;
  }

  $('flipBtn').addEventListener('click', ()=>{
    currentFacing = currentFacing === 'environment' ? 'user' : 'environment';
    startCamera();
  });

  // ---------- live detection loop ----------
  function runDetectLoop(){
    cancelAnimationFrame(detectLoopId);
    const tick = (ts)=>{
      detectLoopId = requestAnimationFrame(tick);
      if (!cvReady || video.readyState < 2) return;
      if (ts - lastDetectTs < 180) return; // throttle ~5-6 fps of detection
      lastDetectTs = ts;
      detectAndDraw();
    };
    detectLoopId = requestAnimationFrame(tick);
  }

  function detectAndDraw(){
    const vw = video.videoWidth, vh = video.videoHeight;
    if (!vw || !vh) return;
    const dw = 320;
    const dh = Math.round(dw * vh / vw);
    const dCanvas = detectAndDraw._c || (detectAndDraw._c = document.createElement('canvas'));
    dCanvas.width = dw; dCanvas.height = dh;
    const dctx = dCanvas.getContext('2d');
    dctx.drawImage(video, 0, 0, dw, dh);

    let src;
    try{ src = cv.imread(dCanvas); } catch(e){ return; }
    const quad = findDocumentQuad(src);
    src.delete();

    octx.clearRect(0,0,overlay.width, overlay.height);
    if (quad){
      lockedFrames = Math.min(lockedFrames+1, 30);
      const scale = vw / dw;
      const pts = quad.map(p => ({x:p.x*scale, y:p.y*scale}));
      drawQuad(octx, pts, lockedFrames > 3);
      setLocked(true);
    } else {
      lockedFrames = 0;
      setLocked(false);
    }
  }

  function setLocked(on){
    statusChip.classList.toggle('locked', on);
    statusText.textContent = on ? 'Hujjat topildi' : 'Hujjat qidirilmoqda';
  }

  function drawQuad(ctx, pts, strong){
    ctx.save();
    ctx.lineWidth = strong ? 4 : 2.5;
    ctx.strokeStyle = strong ? 'rgba(41,211,192,0.95)' : 'rgba(255,255,255,0.55)';
    ctx.fillStyle = strong ? 'rgba(41,211,192,0.12)' : 'rgba(255,255,255,0.04)';
    ctx.beginPath();
    ctx.moveTo(pts[0].x, pts[0].y);
    for (let i=1;i<4;i++) ctx.lineTo(pts[i].x, pts[i].y);
    ctx.closePath();
    ctx.fill();
    ctx.stroke();
    if (strong){
      ctx.fillStyle = 'rgba(41,211,192,0.95)';
      pts.forEach(p=>{
        ctx.beginPath();
        ctx.arc(p.x, p.y, 6, 0, Math.PI*2);
        ctx.fill();
      });
    }
    ctx.restore();
  }

  // ---------- core CV: quad detection ----------
  function orderPoints(pts){
    const s = pts.map(p=>p.x+p.y);
    const d = pts.map(p=>p.y-p.x);
    const tl = pts[s.indexOf(Math.min(...s))];
    const br = pts[s.indexOf(Math.max(...s))];
    const tr = pts[d.indexOf(Math.min(...d))];
    const bl = pts[d.indexOf(Math.max(...d))];
    return [tl,tr,br,bl];
  }

  function findDocumentQuad(srcMat){
    let gray=new cv.Mat(), blur=new cv.Mat(), edges=new cv.Mat(), dil=new cv.Mat();
    let kernel = cv.Mat.ones(3,3, cv.CV_8U);
    try{
      cv.cvtColor(srcMat, gray, cv.COLOR_RGBA2GRAY);
      cv.GaussianBlur(gray, blur, new cv.Size(5,5), 0);
      cv.Canny(blur, edges, 40, 120);
      cv.dilate(edges, dil, kernel, new cv.Point(-1,-1), 1);

      let contours = new cv.MatVector();
      let hierarchy = new cv.Mat();
      cv.findContours(dil, contours, hierarchy, cv.RETR_LIST, cv.CHAIN_APPROX_SIMPLE);

      const imgArea = srcMat.rows * srcMat.cols;
      let bestApprox = null, bestArea = 0;

      for (let i=0;i<contours.size();i++){
        const cnt = contours.get(i);
        const peri = cv.arcLength(cnt, true);
        const approx = new cv.Mat();
        cv.approxPolyDP(cnt, approx, 0.02*peri, true);
        if (approx.rows === 4 && cv.isContourConvex(approx)){
          const area = Math.abs(cv.contourArea(approx));
          if (area > bestArea && area > imgArea*0.12){
            bestArea = area;
            if (bestApprox) bestApprox.delete();
            bestApprox = approx;
          } else {
            approx.delete();
          }
        } else {
          approx.delete();
        }
        cnt.delete();
      }
      contours.delete(); hierarchy.delete();

      if (!bestApprox) return null;
      const pts = [];
      for (let i=0;i<4;i++) pts.push({x:bestApprox.data32S[i*2], y:bestApprox.data32S[i*2+1]});
      bestApprox.delete();
      return orderPoints(pts);
    } finally {
      gray.delete(); blur.delete(); edges.delete(); dil.delete(); kernel.delete();
    }
  }

  // ---------- capture ----------
  function captureFrameToMat(){
    const vw = video.videoWidth, vh = video.videoHeight;
    const c = document.createElement('canvas');
    c.width = vw; c.height = vh;
    c.getContext('2d').drawImage(video, 0, 0, vw, vh);
    return cv.imread(c);
  }

  function loadFileToMat(file){
    return new Promise((resolve)=>{
      const img = new Image();
      const url = URL.createObjectURL(file);
      img.onload = ()=>{
        const c = document.createElement('canvas');
        c.width = img.naturalWidth; c.height = img.naturalHeight;
        c.getContext('2d').drawImage(img,0,0);
        URL.revokeObjectURL(url);
        resolve(cv.imread(c));
      };
      img.src = url;
    });
  }

  function goToReviewWithMat(mat){
    if (capturedMat) capturedMat.delete();
    capturedMat = mat;
    const quad = findDocumentQuad(mat);
    if (quad){
      reviewCorners = quad;
    } else {
      const w = mat.cols, h = mat.rows, m = 0.08;
      reviewCorners = [
        {x:w*m, y:h*m}, {x:w*(1-m), y:h*m},
        {x:w*(1-m), y:h*(1-m)}, {x:w*m, y:h*(1-m)}
      ];
      toast('Chegaralar avtomatik topilmadi, qo\'lda to\'g\'irlang');
    }
    showScreen('review');
    drawReviewCanvas();
  }

  $('shutterBtn').addEventListener('click', ()=>{
    if (!cvReady){ toast('Model hali yuklanmoqda…'); return; }
    if (!video.videoWidth){ toast('Kamera tayyor emas'); return; }
    const mat = captureFrameToMat();
    goToReviewWithMat(mat);
  });

  $('galleryBtn').addEventListener('click', ()=> $('fileInput').click());
  $('fileInput').addEventListener('change', async (e)=>{
    const file = e.target.files[0];
    if (!file || !cvReady) return;
    const mat = await loadFileToMat(file);
    goToReviewWithMat(mat);
    e.target.value = '';
  });

  // ---------- review screen: draggable corners ----------
  const reviewCanvas = $('reviewCanvas');
  const rctx = reviewCanvas.getContext('2d');

  function drawReviewCanvas(){
    if (!capturedMat) return;
    const wrap = reviewCanvas.parentElement;
    const maxW = wrap.clientWidth - 4, maxH = wrap.clientHeight - 4;
    const iw = capturedMat.cols, ih = capturedMat.rows;
    reviewScale = Math.min(maxW/iw, maxH/ih);
    reviewCanvas.width = iw * reviewScale;
    reviewCanvas.height = ih * reviewScale;

    const tmp = document.createElement('canvas');
    tmp.width = iw; tmp.height = ih;
    cv.imshow(tmp, capturedMat);
    rctx.drawImage(tmp, 0, 0, reviewCanvas.width, reviewCanvas.height);

    const pts = reviewCorners.map(p=>({x:p.x*reviewScale, y:p.y*reviewScale}));
    drawQuad(rctx, pts, true);
  }

  function reviewPointerPos(e){
    const r = reviewCanvas.getBoundingClientRect();
    const cx = (e.touches ? e.touches[0].clientX : e.clientX) - r.left;
    const cy = (e.touches ? e.touches[0].clientY : e.clientY) - r.top;
    return {x:cx, y:cy};
  }

  function nearestCornerIdx(pos){
    let idx=-1, best=28*28;
    reviewCorners.forEach((p,i)=>{
      const dx = p.x*reviewScale - pos.x, dy = p.y*reviewScale - pos.y;
      const d2 = dx*dx+dy*dy;
      if (d2 < best){ best=d2; idx=i; }
    });
    return idx;
  }

  reviewCanvas.addEventListener('pointerdown', (e)=>{
    const pos = reviewPointerPos(e);
    draggingIdx = nearestCornerIdx(pos);
    reviewCanvas.setPointerCapture(e.pointerId);
  });
  reviewCanvas.addEventListener('pointermove', (e)=>{
    if (draggingIdx < 0) return;
    const pos = reviewPointerPos(e);
    const iw = capturedMat.cols, ih = capturedMat.rows;
    reviewCorners[draggingIdx] = {
      x: Math.min(Math.max(pos.x/reviewScale, 0), iw),
      y: Math.min(Math.max(pos.y/reviewScale, 0), ih)
    };
    drawReviewCanvas();
  });
  reviewCanvas.addEventListener('pointerup', ()=> draggingIdx = -1);
  window.addEventListener('resize', ()=>{ if (document.getElementById('screen-review').classList.contains('active')) drawReviewCanvas(); });

  $('retakeBtn').addEventListener('click', ()=>{
    showScreen('camera');
  });

  $('cropBtn').addEventListener('click', ()=>{
    if (warpedMat) warpedMat.delete();
    warpedMat = warpDocument(capturedMat, reviewCorners);
    showScreen('result');
    renderResult();
  });

  // ---------- perspective warp ----------
  function warpDocument(srcMat, corners){
    const [tl,tr,br,bl] = corners;
    const wA = Math.hypot(br.x-bl.x, br.y-bl.y);
    const wB = Math.hypot(tr.x-tl.x, tr.y-tl.y);
    const maxW = Math.max(wA, wB);
    const hA = Math.hypot(tr.x-br.x, tr.y-br.y);
    const hB = Math.hypot(tl.x-bl.x, tl.y-bl.y);
    const maxH = Math.max(hA, hB);

    const srcTri = cv.matFromArray(4,1,cv.CV_32FC2, [tl.x,tl.y, tr.x,tr.y, br.x,br.y, bl.x,bl.y]);
    const dstTri = cv.matFromArray(4,1,cv.CV_32FC2, [0,0, maxW,0, maxW,maxH, 0,maxH]);
    const M = cv.getPerspectiveTransform(srcTri, dstTri);
    const dst = new cv.Mat();
    cv.warpPerspective(srcMat, dst, M, new cv.Size(Math.round(maxW), Math.round(maxH)));
    srcTri.delete(); dstTri.delete(); M.delete();
    return dst;
  }

  // ---------- result screen: enhancement modes ----------
  function enhance(mat, mode){
    if (mode === 'original') return mat.clone();
    if (mode === 'color'){
      const out = new cv.Mat();
      mat.convertTo(out, -1, 1.12, 8);
      return out;
    }
    // bw scan look
    const gray = new cv.Mat();
    cv.cvtColor(mat, gray, cv.COLOR_RGBA2GRAY);
    const out = new cv.Mat();
    cv.adaptiveThreshold(gray, out, 255, cv.ADAPTIVE_THRESH_GAUSSIAN_C, cv.THRESH_BINARY, 31, 15);
    gray.delete();
    return out;
  }

  function renderResult(){
    if (!warpedMat) return;
    const processed = enhance(warpedMat, currentMode);
    const rc = $('resultCanvas');
    const wrap = rc.parentElement;
    const maxW = wrap.clientWidth - 24, maxH = wrap.clientHeight - 24;
    const scale = Math.min(maxW/processed.cols, maxH/processed.rows, 1);
    const full = document.createElement('canvas');
    full.width = processed.cols; full.height = processed.rows;
    cv.imshow(full, processed);
    rc.width = processed.cols*scale; rc.height = processed.rows*scale;
    rc.getContext('2d').drawImage(full, 0, 0, rc.width, rc.height);
    processed.delete();
  }

  document.querySelectorAll('.mode-chip').forEach(chip=>{
    chip.addEventListener('click', ()=>{
      document.querySelectorAll('.mode-chip').forEach(c=>c.classList.remove('active'));
      chip.classList.add('active');
      currentMode = chip.dataset.mode;
      renderResult();
    });
  });

  $('newScanBtn').addEventListener('click', ()=> showScreen('camera'));

  $('downloadBtn').addEventListener('click', ()=>{
    if (!warpedMat) return;
    const processed = enhance(warpedMat, currentMode);
    const full = document.createElement('canvas');
    full.width = processed.cols; full.height = processed.rows;
    cv.imshow(full, processed);
    processed.delete();
    full.toBlob((blob)=>{
      const a = document.createElement('a');
      a.href = URL.createObjectURL(blob);
      a.download = 'skan-' + Date.now() + '.jpg';
      a.click();
      toast('Yuklab olindi');
    }, 'image/jpeg', 0.92);
  });

})();
</script>
</body>
