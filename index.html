<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Hujjat skaneri</title>
<style>
  :root{
    --ink:#0d1210;
    --panel:#121a17;
    --line:#2a3a34;
    --accent:#4ee6a8;
    --accent-dim:#2a6b52;
    --warn:#e6c34e;
    --text:#eef5f1;
    --text-dim:#9fb3ac;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{
    margin:0; padding:0; height:100%; background:var(--ink); color:var(--text);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
    overflow:hidden;
  }
  #app{
    position:fixed; inset:0; display:flex; flex-direction:column;
  }
  header{
    padding:14px 18px 10px;
    display:flex; align-items:baseline; justify-content:space-between;
    background:linear-gradient(180deg, rgba(0,0,0,.55), rgba(0,0,0,0));
    position:absolute; top:0; left:0; right:0; z-index:5;
  }
  header h1{
    font-size:17px; font-weight:600; margin:0; letter-spacing:.2px;
  }
  #statusPill{
    font-size:12.5px; padding:5px 11px; border-radius:20px;
    background:rgba(18,26,23,.85); border:1px solid var(--line);
    color:var(--text-dim); transition:color .2s, border-color .2s;
  }
  #statusPill.found{ color:var(--accent); border-color:var(--accent-dim); }
  #statusPill.blurry{ color:var(--warn); border-color:#6b5f2a; }

  #stage{
    position:relative; flex:1; display:flex; align-items:center; justify-content:center;
    background:#000; overflow:hidden;
  }
  #camWrap{ position:relative; width:100%; line-height:0; }
  video, #overlay, #resultCanvas{ width:100%; height:auto; display:block; }
  #overlay{ position:absolute; top:0; left:0; pointer-events:none; }

  #resultScreen{
    position:fixed; inset:0; background:var(--ink); z-index:20;
    display:none; flex-direction:column;
  }
  #resultScreen.show{ display:flex; }
  #resultStage{
    flex:1; display:flex; align-items:center; justify-content:center;
    padding:18px; overflow:auto; background:#050706;
  }
  #resultCanvas{ max-width:100%; max-height:100%; width:auto; border-radius:4px;
    box-shadow:0 8px 30px rgba(0,0,0,.5); }

  footer{
    padding:18px 18px 26px; display:flex; gap:12px; align-items:center; justify-content:center;
    background:linear-gradient(0deg, rgba(0,0,0,.6), rgba(0,0,0,0));
    position:absolute; bottom:0; left:0; right:0; z-index:5;
  }
  .resultFooter{
    position:static; background:var(--panel); border-top:1px solid var(--line);
    padding:16px 18px calc(16px + env(safe-area-inset-bottom));
  }

  button{
    font-family:inherit; border:none; cursor:pointer; -webkit-appearance:none;
  }
  #shutterBtn{
    width:70px; height:70px; border-radius:50%;
    background:var(--text); border:4px solid rgba(255,255,255,.35);
    position:relative;
  }
  #shutterBtn::after{
    content:""; position:absolute; inset:6px; border-radius:50%;
    background:var(--text);
  }
  #shutterBtn:active{ transform:scale(.94); }
  #shutterBtn.autoArmed{ border-color:var(--accent); }

  .sideBtn{
    width:46px; height:46px; border-radius:50%;
    background:rgba(18,26,23,.85); border:1px solid var(--line);
    color:var(--text); font-size:19px; display:flex; align-items:center; justify-content:center;
  }
  .sideBtn.on{ color:var(--accent); border-color:var(--accent-dim); }

  .rowCenter{ display:flex; align-items:center; gap:22px; }

  .pillBtn{
    flex:1; padding:13px 16px; border-radius:10px; font-size:15px; font-weight:600;
    display:flex; align-items:center; justify-content:center; gap:6px;
  }
  .pillBtn.primary{ background:var(--accent); color:#08130f; }
  .pillBtn.secondary{ background:transparent; color:var(--text); border:1px solid var(--line); }

  #hint{
    position:absolute; left:0; right:0; bottom:112px; text-align:center; z-index:5;
    font-size:12.5px; color:var(--text-dim); padding:0 30px; pointer-events:none;
  }

  #permScreen, #loadingScreen{
    position:absolute; inset:0; z-index:30; display:flex; flex-direction:column;
    align-items:center; justify-content:center; gap:14px; padding:30px; text-align:center;
    background:var(--ink);
  }
  #permScreen p, #loadingScreen p{ color:var(--text-dim); font-size:14px; max-width:280px; line-height:1.5; margin:0; }
  .spinner{
    width:34px; height:34px; border-radius:50%; border:3px solid var(--line);
    border-top-color:var(--accent); animation:spin 1s linear infinite;
  }
  @keyframes spin{ to{ transform:rotate(360deg); } }
  #permScreen button{ margin-top:6px; padding:12px 26px; border-radius:10px; background:var(--accent); color:#08130f; font-weight:600; font-size:14.5px; }

  #flash{
    position:fixed; inset:0; background:#fff; opacity:0; pointer-events:none; z-index:40;
  }
  #flash.go{ animation:flash .35s ease-out; }
  @keyframes flash{ 0%{opacity:.85;} 100%{opacity:0;} }
</style>
</head>
<body>
<div id="app">

  <div id="loadingScreen">
    <div class="spinner"></div>
    <p>Tayyorlanmoqda…</p>
  </div>

  <div id="permScreen" style="display:none;">
    <p>Kamera uchun ruxsat kerak. Hujjatni skaner qilish uchun kameraga ruxsat bering.</p>
    <button id="retryPermBtn">Qayta urinish</button>
  </div>

  <header>
    <h1>Hujjat skaneri</h1>
    <div id="statusPill">Qidirilmoqda…</div>
  </header>

  <div id="stage">
    <div id="camWrap">
      <video id="video" autoplay playsinline muted></video>
      <canvas id="overlay"></canvas>
    </div>
    <div id="hint">Hujjatni to'liq kadr ichiga sig'diring (chetlari kesilmasin) — tiniq bo'lgan zahoti bitta marta avtomatik suratga oladi</div>
  </div>

  <footer>
    <button class="sideBtn" id="autoBtn" title="Avto-suratga olish">A</button>
    <div class="rowCenter">
      <button id="shutterBtn"></button>
    </div>
    <button class="sideBtn" id="torchBtn" title="Chiroq" style="visibility:hidden;">⚡</button>
  </footer>
</div>

<div id="resultScreen">
  <div id="resultStage">
    <canvas id="resultCanvas"></canvas>
  </div>
  <div class="rowCenter resultFooter">
    <button class="pillBtn secondary" id="retakeBtn">Qayta olish</button>
    <button class="pillBtn primary" id="saveBtn">Saqlash</button>
  </div>
</div>

<div id="flash"></div>

<canvas id="procCanvas" style="display:none;"></canvas>
<canvas id="fullCanvas" style="display:none;"></canvas>

<script async src="https://docs.opencv.org/4.9.0/opencv.js" onload="onOpenCvReady()" onerror="onOpenCvError()"></script>

<script>
(function(){
  const video = document.getElementById('video');
  const overlay = document.getElementById('overlay');
  const octx = overlay.getContext('2d');
  const procCanvas = document.getElementById('procCanvas');
  const fullCanvas = document.getElementById('fullCanvas');
  const statusPill = document.getElementById('statusPill');
  const shutterBtn = document.getElementById('shutterBtn');
  const autoBtn = document.getElementById('autoBtn');
  const resultScreen = document.getElementById('resultScreen');
  const resultCanvas = document.getElementById('resultCanvas');
  const retakeBtn = document.getElementById('retakeBtn');
  const saveBtn = document.getElementById('saveBtn');
  const loadingScreen = document.getElementById('loadingScreen');
  const permScreen = document.getElementById('permScreen');
  const retryPermBtn = document.getElementById('retryPermBtn');
  const flashEl = document.getElementById('flash');

  const PROC_WIDTH = 320;
  let cvReady = false;
  let camReady = false;
  let lastQuad = null;        // 4 points in full-res video coordinates
  let stableCount = 0;
  let lastStableQuad = null;
  let autoCapture = true;
  let rafId = null;
  let busyCapturing = false;

  function onOpenCvError(){
    statusPill.textContent = 'Xato: OpenCV yuklanmadi';
  }
  window.onOpenCvError = onOpenCvError;

  window.onOpenCvReady = function(){
    if (typeof cv === 'undefined') { onOpenCvError(); return; }
    if (cv.getBuildInformation) { cvReady = true; startIfReady(); }
    else { cv['onRuntimeInitialized'] = function(){ cvReady = true; startIfReady(); }; }
  };

  function startIfReady(){
    if (cvReady) initCamera();
  }

  async function initCamera(){
    try{
      const stream = await navigator.mediaDevices.getUserMedia({
        video: { facingMode: { ideal: 'environment' }, width: { ideal: 1920 }, height: { ideal: 1080 } },
        audio: false
      });
      video.srcObject = stream;
      await new Promise(res => { video.onloadedmetadata = res; });
      await video.play();
      camReady = true;
      loadingScreen.style.display = 'none';
      permScreen.style.display = 'none';
      overlay.width = video.videoWidth;
      overlay.height = video.videoHeight;
      procCanvas.width = PROC_WIDTH;
      procCanvas.height = Math.round(PROC_WIDTH * video.videoHeight / video.videoWidth);
      fullCanvas.width = video.videoWidth;
      fullCanvas.height = video.videoHeight;
      loop();
    }catch(err){
      loadingScreen.style.display = 'none';
      permScreen.style.display = 'flex';
    }
  }

  autoBtn.classList.add('on');
  shutterBtn.classList.add('autoArmed');

  retryPermBtn.addEventListener('click', () => {
    permScreen.style.display = 'none';
    loadingScreen.style.display = 'flex';
    initCamera();
  });

  function orderPoints(pts){
    // pts: array of {x,y} length 4 -> returns [tl,tr,br,bl]
    let sum = pts.map(p => p.x + p.y);
    let diff = pts.map(p => p.x - p.y);
    const tl = pts[sum.indexOf(Math.min(...sum))];
    const br = pts[sum.indexOf(Math.max(...sum))];
    const tr = pts[diff.indexOf(Math.max(...diff))];
    const bl = pts[diff.indexOf(Math.min(...diff))];
    return [tl,tr,br,bl];
  }

  function dist(a,b){ return Math.hypot(a.x-b.x, a.y-b.y); }

  function quadsClose(a,b,tolPx){
    if(!a || !b) return false;
    for(let i=0;i<4;i++){ if(dist(a[i],b[i]) > tolPx) return false; }
    return true;
  }

  function angleAt(p0,p1,p2){
    // p1 dagi burchak (gradus)
    const v1x=p0.x-p1.x, v1y=p0.y-p1.y, v2x=p2.x-p1.x, v2y=p2.y-p1.y;
    const dot=v1x*v2x+v1y*v2y;
    const m1=Math.hypot(v1x,v1y), m2=Math.hypot(v2x,v2y);
    if(m1===0||m2===0) return 0;
    let cosA = dot/(m1*m2);
    cosA = Math.max(-1, Math.min(1, cosA));
    return Math.acos(cosA) * 180/Math.PI;
  }

  function isRectangleLike(pts){
    // pts: 4 ta {x,y}, ketma-ket burchaklar bo'ylab
    for(let i=0;i<4;i++){
      const p0 = pts[(i+3)%4], p1 = pts[i], p2 = pts[(i+1)%4];
      const a = angleAt(p0,p1,p2);
      if(a < 45 || a > 135) return false;
    }
    return true;
  }

  function detectQuad(){
    const pctx = procCanvas.getContext('2d');
    pctx.drawImage(video, 0, 0, procCanvas.width, procCanvas.height);
    const scale = video.videoWidth / procCanvas.width;

    let src = cv.imread(procCanvas);
    let gray = new cv.Mat();
    let blurred = new cv.Mat();
    let edged = new cv.Mat();
    let kernel = cv.Mat.ones(3,3,cv.CV_8U);
    let contours = new cv.MatVector();
    let hierarchy = new cv.Mat();

    cv.cvtColor(src, gray, cv.COLOR_RGBA2GRAY);
    cv.GaussianBlur(gray, blurred, new cv.Size(5,5), 0);
    cv.Canny(blurred, edged, 30, 120);
    cv.morphologyEx(edged, edged, cv.MORPH_CLOSE, kernel);

    cv.findContours(edged, contours, hierarchy, cv.RETR_LIST, cv.CHAIN_APPROX_SIMPLE);

    // Tiniqlik (fokus) testi — Laplacian dispersiyasi
    let lap = new cv.Mat();
    cv.Laplacian(gray, lap, cv.CV_64F);
    let meanM = new cv.Mat(), stdM = new cv.Mat();
    cv.meanStdDev(lap, meanM, stdM);
    const sharpness = Math.pow(stdM.data64F[0], 2);
    lap.delete(); meanM.delete(); stdM.delete();

    let best = null;
    let bestArea = 0;
    const imgArea = procCanvas.width * procCanvas.height;
    const edgeMargin = 2;

    for(let i=0; i<contours.size(); i++){
      const c = contours.get(i);
      const peri = cv.arcLength(c, true);
      const approx = new cv.Mat();
      cv.approxPolyDP(c, approx, 0.02*peri, true);
      if(approx.rows === 4){
        const area = Math.abs(cv.contourArea(approx));
        let touchesEdge = false;
        const cornerPts = [];
        for(let k=0; k<4; k++){
          const px = approx.data32S[k*2];
          const py = approx.data32S[k*2+1];
          cornerPts.push({x:px, y:py});
          if(px <= edgeMargin || py <= edgeMargin ||
             px >= procCanvas.width - edgeMargin || py >= procCanvas.height - edgeMargin){
            touchesEdge = true; break;
          }
        }
        // touchesEdge: hujjat kadrdan chiqib/kesilib turibdi — rad etamiz
        // area juda kichik: uzoqdagi tasodifiy shakl — rad etamiz
        // area juda katta (>94%): butun kadrni (stol bilan) qamrab olgan — rad etamiz
        // isRectangleLike: burchaklar ~90° bo'lmasa (stol qirrasi, soya) — rad etamiz
        const areaOk = area > imgArea*0.08 && area < imgArea*0.97;
        if(!touchesEdge && areaOk && area > bestArea &&
           cv.isContourConvex(approx) && isRectangleLike(cornerPts)){
          bestArea = area;
          if(best) best.delete();
          best = approx;
        } else {
          approx.delete();
        }
      } else {
        approx.delete();
      }
      c.delete();
    }

    let quad = null;
    if(best){
      const pts = [];
      for(let i=0;i<4;i++){
        pts.push({ x: best.data32S[i*2]*scale, y: best.data32S[i*2+1]*scale });
      }
      quad = orderPoints(pts);
      best.delete();
    }

    src.delete(); gray.delete(); blurred.delete(); edged.delete();
    kernel.delete(); contours.delete(); hierarchy.delete();

    return { quad, sharpness };
  }

  function drawOverlay(quad){
    octx.clearRect(0,0,overlay.width,overlay.height);
    if(!quad) return;
    octx.save();
    octx.lineJoin = 'round';
    octx.strokeStyle = 'rgba(78,230,168,0.95)';
    octx.lineWidth = Math.max(3, overlay.width*0.006);
    octx.beginPath();
    octx.moveTo(quad[0].x, quad[0].y);
    for(let i=1;i<4;i++) octx.lineTo(quad[i].x, quad[i].y);
    octx.closePath();
    octx.stroke();
    octx.fillStyle = 'rgba(78,230,168,0.12)';
    octx.fill();
    const r = overlay.width*0.012;
    octx.fillStyle = 'rgba(78,230,168,0.95)';
    quad.forEach(p => {
      octx.beginPath();
      octx.arc(p.x, p.y, r, 0, Math.PI*2);
      octx.fill();
    });
    octx.restore();
  }

  let frameSkip = 0;
  function loop(){
    rafId = requestAnimationFrame(loop);
    if(!camReady || busyCapturing) return;
    frameSkip++;
    if(frameSkip % 3 !== 0) return; // throttle detection ~ every 3rd frame

    const { quad, sharpness } = detectQuad();
    lastQuad = quad;
    drawOverlay(quad);

    const SHARPNESS_THRESHOLD = 8; // yumshatildi — tez va oson topsin
    const isSharp = sharpness >= SHARPNESS_THRESHOLD;

    if(quad && isSharp){
      statusPill.textContent = 'Hujjat topildi';
      statusPill.classList.remove('blurry');
      statusPill.classList.add('found');
      if(autoCapture){
        capture(); // topilgan va tiniq bo'lgan zahoti darhol suratga oladi
      }
    } else if(quad && !isSharp){
      statusPill.textContent = 'Fokuslanmoqda…';
      statusPill.classList.remove('found');
      statusPill.classList.add('blurry');
    } else {
      statusPill.textContent = 'Qidirilmoqda…';
      statusPill.classList.remove('found');
      statusPill.classList.remove('blurry');
    }
  }

  function insetQuad(quad, factor){
    const cx = (quad[0].x+quad[1].x+quad[2].x+quad[3].x)/4;
    const cy = (quad[0].y+quad[1].y+quad[2].y+quad[3].y)/4;
    return quad.map(p => ({
      x: p.x + (cx - p.x) * factor,
      y: p.y + (cy - p.y) * factor
    }));
  }

  function warpAndShow(rawQuad){
    const quad = insetQuad(rawQuad, 0); // foydalanuvchi so'rovi bo'yicha ichkariga surish o'chirildi
    const fctx = fullCanvas.getContext('2d');
    fctx.drawImage(video, 0, 0, fullCanvas.width, fullCanvas.height);

    const [tl,tr,br,bl] = quad;
    const widthTop = dist(tl,tr);
    const widthBottom = dist(bl,br);
    const heightLeft = dist(tl,bl);
    const heightRight = dist(tr,br);
    const outW = Math.round(Math.max(widthTop, widthBottom));
    const outH = Math.round(Math.max(heightLeft, heightRight));

    let src = cv.imread(fullCanvas);
    let dst = new cv.Mat();
    let srcTri = cv.matFromArray(4, 1, cv.CV_32FC2, [
      tl.x, tl.y, tr.x, tr.y, br.x, br.y, bl.x, bl.y
    ]);
    let dstTri = cv.matFromArray(4, 1, cv.CV_32FC2, [
      0,0, outW,0, outW,outH, 0,outH
    ]);
    let M = cv.getPerspectiveTransform(srcTri, dstTri);
    let dsize = new cv.Size(outW, outH);
    cv.warpPerspective(src, dst, M, dsize, cv.INTER_LINEAR, cv.BORDER_CONSTANT, new cv.Scalar());

    resultCanvas.width = outW;
    resultCanvas.height = outH;
    cv.imshow(resultCanvas, dst);

    src.delete(); dst.delete(); srcTri.delete(); dstTri.delete(); M.delete();
  }

  function capture(){
    if(busyCapturing) return;
    if(!lastQuad){
      // Hujjat topilmagan — hech narsa tushirmaymiz, stol/fon bilan birga olib qolmaslik uchun
      statusPill.textContent = 'Topilmadi — yaqinroq tuting';
      return;
    }
    busyCapturing = true;
    flashEl.classList.add('go');
    setTimeout(() => flashEl.classList.remove('go'), 350);

    warpAndShow(lastQuad);
    resultScreen.classList.add('show');
    // busyCapturing "Qayta olish" bosilmaguncha true bo'lib qoladi —
    // shu tufayli orqa fonda qayta-qayta suratga olib ketmaydi.
  }

  shutterBtn.addEventListener('click', capture);

  autoBtn.addEventListener('click', () => {
    autoCapture = !autoCapture;
    autoBtn.classList.toggle('on', autoCapture);
    shutterBtn.classList.toggle('autoArmed', autoCapture);
    stableCount = 0;
  });

  retakeBtn.addEventListener('click', () => {
    resultScreen.classList.remove('show');
    stableCount = 0;
    lastQuad = null;
    lastStableQuad = null;
    busyCapturing = false; // endi orqa kamera ko'rinishiga qaytdik — qidiruv qayta boshlanadi
  });

  saveBtn.addEventListener('click', () => {
    const link = document.createElement('a');
    const ts = new Date().toISOString().replace(/[:.]/g,'-');
    link.download = 'hujjat-' + ts + '.png';
    link.href = resultCanvas.toDataURL('image/png');
    link.click();
  });

})();
</script>
</body>
</html>
